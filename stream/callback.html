<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to Today List</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #FAF7F2; color: #0F172A; font: 17px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  a { color: #0F172A; }
</style>
</head>
<body>
<p>Returning to Today List… <a id="open" href="#">Open the app</a></p>
<script>
  // Stream (Sandbar) only redirects to https, so sign-in lands here and is
  // handed straight to the app. Nothing is stored or sent anywhere: the code
  // in the URL is useless without the secret that never leaves the phone.
  var target = 'today-list://stream-auth' + window.location.search;
  document.getElementById('open').href = target;
  window.location.replace(target);
</script>
</body>
</html>
